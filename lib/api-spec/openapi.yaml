        projectId:
          type: integer
        type:
          type: string
        name:
          type: string
        url:
          type: ["string", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        fileSize:
          type: ["integer", "null"]
        mimeType:
          type: ["string", "null"]
        createdAt:
          type: string

    # ── Analytics ────────────────────────────────────────────────────────────
    ProjectAnalytics:
      type: object
      required: [projectId, period]
      properties:
        projectId:
          type: integer
        period:
          type: string
        websiteTraffic:
          type: integer
        leads:
          type: integer
        revenue:
          type: number
        adSpend:
          type: number
        roas:
          type: number
        topContent:
          type: array
          items:
            $ref: "#/components/schemas/ContentAsset"
        topVideos:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        chartData:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataPoint"

    ChartDataPoint:
      type: object
      required: [date, value]
