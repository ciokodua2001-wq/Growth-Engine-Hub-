          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competitor"
    post:
      operationId: discoverCompetitors
      tags: [competitors]
      summary: Discover competitors automatically
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discovered competitors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competitor"

  /projects/{id}/competitors/{competitorId}:
    get:
      operationId: getCompetitor
      tags: [competitors]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: competitorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Competitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competitor"

  /projects/{id}/competitor-report:
    get:
      operationId: getCompetitorReport
      tags: [competitors]
      summary: Get competitive intelligence report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Competitor report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorReport"
    post:
      operationId: generateCompetitorReport
      tags: [competitors]
      summary: Generate competitive intelligence report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorReport"

  # ── Content ────────────────────────────────────────────────────────────────
  /projects/{id}/content:
    get:
      operationId: listContent
      tags: [content]
      summary: List content assets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentAsset"
    post:
      operationId: generateContent
      tags: [content]
      summary: Generate content assets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentGenerationInput"
      responses:
        "200":
          description: Generated content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentAsset"

  /projects/{id}/content/{contentId}:
    get:
      operationId: getContent
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: contentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Content asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentAsset"
    delete:
      operationId: deleteContent
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: contentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Social ─────────────────────────────────────────────────────────────────
  /projects/{id}/social-posts:
    get:
      operationId: listSocialPosts
      tags: [social]
      summary: List social media posts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of social posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocialPost"
    post:
      operationId: generateSocialPosts
      tags: [social]
      summary: Generate social media posts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialPostInput"
      responses:
        "200":
          description: Generated social posts
          content:
            application/json:
              schema:
                type: array
