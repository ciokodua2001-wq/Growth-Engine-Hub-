                  $ref: "#/components/schemas/Asset"

  # ── Analytics ──────────────────────────────────────────────────────────────
  /projects/{id}/analytics:
    get:
      operationId: getProjectAnalytics
      tags: [analytics]
      summary: Get project analytics overview
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAnalytics"

  /projects/{id}/reports:
    get:
      operationId: listReports
      tags: [analytics]
      summary: List generated reports
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: generateReport
      tags: [analytics]
      summary: Generate a report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "200":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  # ── AI Agent ───────────────────────────────────────────────────────────────
  /projects/{id}/agent/chat:
    post:
      operationId: agentChat
      tags: [agent]
      summary: Send a message to the AI marketing agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentMessageInput"
      responses:
        "200":
          description: Agent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMessage"

  /projects/{id}/agent/history:
    get:
      operationId: getAgentHistory
      tags: [agent]
      summary: Get AI agent conversation history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentMessage"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Project ──────────────────────────────────────────────────────────────
    Project:
      type: object
      required: [id, name, websiteUrl, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        websiteUrl:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
        industry:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        autonomousMode:
          type: boolean
        plan:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    ProjectInput:
      type: object
      required: [name, websiteUrl]
      properties:
        name:
          type: string
        websiteUrl:
          type: string
        description:
          type: string

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        websiteUrl:
          type: string
        description:
          type: string
        autonomousMode:
          type: boolean

    DashboardSummary:
      type: object
      required: [projectId, totalContent, totalVideos, totalCampaigns, totalCompetitors, recentActivity]
      properties:
        projectId:
          type: integer
        totalContent:
          type: integer
        totalVideos:
          type: integer
        totalCampaigns:
          type: integer
        totalCompetitors:
          type: integer
        totalAds:
          type: integer
        totalEmails:
          type: integer
        totalSocialPosts:
          type: integer
        analysisStatus:
          type: ["string", "null"]
        hasStrategy:
          type: boolean
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        topMetrics:
          type: array
          items:
            $ref: "#/components/schemas/MetricItem"

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        createdAt:
          type: string

    MetricItem:
      type: object
      required: [label, value, change]
      properties:
        label:
          type: string
        value:
          type: string
        change:
          type: number
        trend:
          type: string

    # ── Analysis ─────────────────────────────────────────────────────────────
    AnalysisInput:
      type: object
      required: [websiteUrl]
      properties:
        websiteUrl:
          type: string
        prompt:
          type: string

    BusinessAnalysis:
      type: object
      required: [id, projectId, status, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        status:
          type: string
        businessSummary:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        products:
          type: ["string", "null"]
        services:
          type: ["string", "null"]
        uniqueValueProposition:
          type: ["string", "null"]
        targetCustomers:
          type: ["string", "null"]
        idealCustomerProfile:
          type: ["string", "null"]
        customerPainPoints:
          type: ["string", "null"]
        brandVoice:
          type: ["string", "null"]
        brandPositioning:
          type: ["string", "null"]
        customerBenefits:
          type: ["string", "null"]
        purchaseTriggers:
          type: ["string", "null"]
        marketOpportunities:
          type: ["string", "null"]
        growthOpportunities:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    CustomerPersona:
      type: object
      required: [id, projectId, name, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        age:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        occupation:
          type: ["string", "null"]
        income:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        interests:
          type: ["string", "null"]
        motivations:
          type: ["string", "null"]
        objections:
          type: ["string", "null"]
        buyingTriggers:
