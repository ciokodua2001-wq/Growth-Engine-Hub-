              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailCampaign"
    post:
      operationId: generateEmails
      tags: [email]
      summary: Generate email campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCampaignInput"
      responses:
        "200":
          description: Generated email campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailCampaign"

  # ── Ads ────────────────────────────────────────────────────────────────────
  /projects/{id}/ads:
    get:
      operationId: listAds
      tags: [ads]
      summary: List ad creatives
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of ads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdCreative"
    post:
      operationId: generateAds
      tags: [ads]
      summary: Generate ad creatives
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
