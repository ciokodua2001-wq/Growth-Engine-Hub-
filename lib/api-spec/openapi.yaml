  # ── Assets ─────────────────────────────────────────────────────────────────
  /projects/{id}/assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List all assets in library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
