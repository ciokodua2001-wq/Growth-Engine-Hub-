      properties:
        id:
          type: integer
        projectId:
          type: integer
        title:
          type: string
        type:
          type: string
        status:
          type: string
        script:
          type: ["string", "null"]
        storyboard:
          type: ["string", "null"]
        voiceover:
          type: ["string", "null"]
        cinematicPlan:
          type: ["string", "null"]
          description: JSON string of the full cinematic production blueprint
        thumbnailUrl:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        duration:
          type: ["integer", "null"]
        hookStrength:
          type: ["integer", "null"]
        engagementPotential:
          type: ["integer", "null"]
        viralPotential:
          type: ["integer", "null"]
        createdAt:
          type: string
        renderStatus:
          type: string
        renderMode:
          type: ["string", "null"]
        renderResolution:
          type: ["string", "null"]
        renderJobId:
          type: ["string", "null"]
        renderStartedAt:
          type: ["string", "null"]
        renderCompletedAt:
          type: ["string", "null"]
        renderError:
          type: ["string", "null"]
        voiceoverUrl:
          type: ["string", "null"]
        avatarPhotoPath:
          type: ["string", "null"]

    VideoUpdate:
      type: object
      properties:
        title:
          type: string
        script:
          type: string
        storyboard:
          type: string
        voiceover:
          type: string

    # ── Campaigns ────────────────────────────────────────────────────────────
    CampaignInput:
      type: object
      required: [name, platform]
      properties:
        name:
          type: string
        platform:
          type: string
        budget:
          type: number
        prompt:
          type: string

    CampaignUpdate:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        budget:
          type: number
        autonomousOptimization:
          type: boolean

    Campaign:
      type: object
      required: [id, projectId, name, platform, status, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        platform:
          type: string
        status:
          type: string
        budget:
          type: ["number", "null"]
        spent:
          type: ["number", "null"]
        impressions:
          type: ["integer", "null"]
        clicks:
          type: ["integer", "null"]
        conversions:
          type: ["integer", "null"]
        roas:
          type: ["number", "null"]
        ctr:
          type: ["number", "null"]
        cpc:
          type: ["number", "null"]
        autonomousOptimization:
          type: boolean
        createdAt:
          type: string

    CampaignPerformance:
      type: object
      required: [campaignId, period]
      properties:
        campaignId:
          type: integer
        period:
          type: string
        impressions:
          type: integer
        clicks:
          type: integer
        conversions:
          type: integer
        spend:
          type: number
        revenue:
          type: number
        roas:
          type: number
        ctr:
          type: number
        cpc:
          type: number
        cpa:
          type: number

