        count:
          type: integer
        prompt:
          type: string

    ContentAsset:
      type: object
      required: [id, projectId, type, title, status, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        type:
          type: string
        title:
          type: string
        body:
          type: ["string", "null"]
        metaDescription:
          type: ["string", "null"]
        seoKeywords:
          type: ["string", "null"]
        status:
          type: string
        hookStrength:
          type: ["integer", "null"]
        conversionPotential:
          type: ["integer", "null"]
        engagementPotential:
          type: ["integer", "null"]
        viralPotential:
          type: ["integer", "null"]
        createdAt:
          type: string

    # ── Social ───────────────────────────────────────────────────────────────
    SocialPostInput:
      type: object
      required: [platforms]
      properties:
        platforms:
          type: array
          items:
            type: string
        count:
          type: integer
        prompt:
          type: string

    SocialPost:
      type: object
      required: [id, projectId, platform, caption, status, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        platform:
          type: string
        caption:
          type: string
        hashtags:
          type: ["string", "null"]
        cta:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        status:
          type: string
        scheduledAt:
          type: ["string", "null"]
        publishedAt:
          type: ["string", "null"]
        externalPostId:
          type: ["string", "null"]
        statsLikes:
          type: ["integer", "null"]
        statsComments:
          type: ["integer", "null"]
        statsReach:
          type: ["integer", "null"]
        statsUpdatedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    MetaStatus:
      type: object
      required: [connected, decryptable]
      properties:
        connected:
          type: boolean
        decryptable:
          type: boolean

    MetaConnection:
      type: object
      required: [connected]
      properties:
        connected:
          type: boolean
        pageId:
          type: ["string", "null"]
        pageName:
          type: ["string", "null"]
        instagramAccountId:
          type: ["string", "null"]
        connectedAt:
          type: ["string", "null"]

    MetaPageOption:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    MetaPagesResult:
      type: object
      required: [projectId, pages]
      properties:
        projectId:
          type: integer
        pages:
          type: array
          items:
            $ref: "#/components/schemas/MetaPageOption"

    MetaPageSelectInput:
      type: object
      required: [token, pageId]
      properties:
        token:
          type: string
        pageId:
          type: string

    SocialPostStats:
      type: object
      required: [postId, externalPostId]
      properties:
        postId:
          type: integer
        externalPostId:
          type: string
        likes:
          type: ["integer", "null"]
        comments:
          type: ["integer", "null"]
        reach:
          type: ["integer", "null"]
        statsUpdatedAt:
          type: ["string", "null"]

    PublishSocialInput:
      type: object
      required: [platform]
      properties:
        platform:
          type: string
          enum: [facebook, instagram]

    CalendarEntry:
      type: object
      required: [date, posts]
      properties:
        date:
          type: string
        posts:
          type: array
          items:
            $ref: "#/components/schemas/SocialPost"

    # ── Email ────────────────────────────────────────────────────────────────
    EmailCampaignInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
        subject:
          type: string
        prompt:
          type: string

    EmailCampaign:
      type: object
      required: [id, projectId, type, subject, status, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        type:
          type: string
        subject:
          type: string
        body:
          type: ["string", "null"]
        previewText:
          type: ["string", "null"]
        status:
          type: string
        openRate:
          type: ["number", "null"]
        clickRate:
          type: ["number", "null"]
        sentAt:
          type: ["string", "null"]
        recipientCount:
          type: ["integer", "null"]
        sentCount:
          type: ["integer", "null"]
        failCount:
          type: ["integer", "null"]
        createdAt:
          type: string

    EmailSendConfig:
      type: object
      required: [configured, fromAddress]
      properties:
        configured:
          type: boolean
        fromAddress:
          type: string

    EmailSendInput:
      type: object
      required: [recipients]
      properties:
        recipients:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 50

    # ── Ads ──────────────────────────────────────────────────────────────────
    AdInput:
      type: object
      required: [platform]
      properties:
        platform:
          type: string
        count:
          type: integer
        prompt:
          type: string

    AdCreative:
      type: object
      required: [id, projectId, platform, headline, status, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        platform:
          type: string
        headline:
          type: string
        description:
          type: ["string", "null"]
        cta:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        type:
          type: string
        hookStrength:
          type: ["integer", "null"]
        conversionPotential:
          type: ["integer", "null"]
        status:
          type: string
        createdAt:
          type: string

    # ── Videos ───────────────────────────────────────────────────────────────
    VideoInput:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
        type:
          type: string
        count:
          type: integer
        prompt:
          type: string
        targetDuration:
          type: integer
          enum: [15, 30, 45, 60, 90]
          description: Target video duration in seconds. AI will write scripts and shots to match.

    Video:
      type: object
