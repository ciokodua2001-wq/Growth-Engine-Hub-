            $ref: "#/components/schemas/Competitor"
        marketGaps:
          type: ["string", "null"]
        positioningOpportunities:
          type: ["string", "null"]
        winningHooks:
          type: ["string", "null"]
        winningCtas:
          type: ["string", "null"]
        generatedAt:
          type: string

    # ── Content ──────────────────────────────────────────────────────────────
    ContentGenerationInput:
      type: object
      required: [type]
      properties:
        type:
