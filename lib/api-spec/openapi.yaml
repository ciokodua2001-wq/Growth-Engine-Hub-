        date:
          type: string
        value:
          type: number
        label:
          type: string

    ReportInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
        period:
          type: string

    Report:
      type: object
      required: [id, projectId, type, period, status, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        type:
          type: string
        period:
          type: string
        status:
          type: string
        summary:
          type: ["string", "null"]
        kpiTrends:
          type: ["string", "null"]
        recommendations:
          type: ["string", "null"]
        createdAt:
          type: string

    # ── Video Render ─────────────────────────────────────────────────────────
    VideoRenderInput:
      type: object
      properties:
        mode:
          type: string
          enum: [footage, avatar, combined]
          default: footage
        resolution:
          type: string
          enum: ["1080p", "4k"]
          default: "1080p"
        aspectRatio:
          type: string
          enum: ["16:9", "9:16", "1:1", "4:5"]
          default: "16:9"
          description: Output aspect ratio for the rendered video.
        captionsEnabled:
          type: boolean
          default: false
          description: When true, bold burned-in captions are embedded in the video.
        avatarId:
          type: integer
          description: ID of the avatar from the project avatar library to use for avatar/combined render modes.
        platformAvatarId:
          type: integer
          description: ID of the platform avatar from the shared library to use for avatar/combined render modes.

    PlatformAvatar:
      type: object
      required: [id, name, gender, archetype, previewUrl, isActive, sortOrder, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        gender:
          type: string
        archetype:
          type: string
        previewUrl:
          type: string
        heygenTalkingPhotoId:
          type: ["string", "null"]
        isActive:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string

    PlatformAvatarList:
      type: object
      required: [avatars]
      properties:
        avatars:
          type: array
          items:
            $ref: "#/components/schemas/PlatformAvatar"

    ProjectAvatar:
      type: object
      required: [id, projectId, name, photoUrl, isDefault, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        photoUrl:
          type: string
        instructions:
          type: ["string", "null"]
        isDefault:
          type: boolean
        createdAt:
          type: string

    VideoRenderStatus:
      type: object
      required: [videoId, renderStatus]
      properties:
        videoId:
          type: integer
        renderStatus:
          type: string
        renderMode:
          type: ["string", "null"]
        renderResolution:
          type: ["string", "null"]
        renderStartedAt:
          type: ["string", "null"]
        renderCompletedAt:
          type: ["string", "null"]
        renderError:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        voiceoverUrl:
          type: ["string", "null"]

    AvatarUploadResponse:
      type: object
      required: [avatarPhotoPath]
      properties:
        avatarPhotoPath:
          type: string
        video:
          $ref: "#/components/schemas/Video"

    # ── Images ───────────────────────────────────────────────────────────────
    ImageGenerateInput:
      type: object
      properties:
        prompt:
          type: ["string", "null"]
        style:
          type: string
          enum: [photorealistic, illustration, "3d", minimal, cinematic]
          default: photorealistic
        orientation:
          type: string
          enum: [landscape, portrait, square]
          default: landscape
        count:
          type: integer
          minimum: 1
          maximum: 4
          default: 1

    GeneratedImages:
      type: object
      required: [urls, count]
      properties:
        urls:
          type: array
          items:
            type: string
        prompt:
          type: string
        style:
          type: string
        orientation:
          type: string
        count:
          type: integer

    # ── Storage ──────────────────────────────────────────────────────────────
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"

    ProjectUsage:
      type: object
      required: [plan, usage]
      properties:
        plan:
          type: string
        periodStart:
          type: ["string", "null"]
        renderedVideoSeconds:
          type: integer
          description: Total seconds of video successfully rendered for this project
        renderedVideoSecondsLimit:
          type: ["integer", "null"]
          description: Per-plan cap on rendered video seconds (null = unlimited)
        usage:
          type: object
          additionalProperties:
            type: object
            required: [used]
            properties:
              used:
                type: integer
              limit:
                type: ["integer", "null"]

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Agent ────────────────────────────────────────────────────────────────
    AgentMessageInput:
      type: object
      required: [message]
      properties:
        message:
          type: string

    AgentMessage:
      type: object
      required: [id, projectId, role, content, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        role:
          type: string
        content:
          type: string
        actionType:
          type: ["string", "null"]
        actionResult:
          type: ["string", "null"]
        createdAt:
          type: string
