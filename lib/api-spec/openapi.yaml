openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: GrowthForge AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: projects
  - name: analysis
  - name: competitors
  - name: strategy
  - name: content
  - name: social
  - name: email
  - name: ads
  - name: videos
  - name: campaigns
  - name: assets
  - name: analytics
  - name: agent
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Projects ──────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/dashboard:
    get:
      operationId: getProjectDashboard
      tags: [projects]
      summary: Get dashboard summary for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ── Analysis ───────────────────────────────────────────────────────────────
  /projects/{id}/analyze:
    post:
      operationId: analyzeWebsite
      tags: [analysis]
      summary: Trigger website analysis for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessAnalysis"

  /projects/{id}/analysis:
    get:
      operationId: getBusinessAnalysis
      tags: [analysis]
      summary: Get stored business analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Business analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessAnalysis"

  /projects/{id}/personas:
    get:
      operationId: listPersonas
      tags: [analysis]
      summary: List customer personas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of personas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerPersona"
    post:
      operationId: generatePersonas
      tags: [analysis]
      summary: Generate customer personas for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated personas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerPersona"

  # ── Strategy ───────────────────────────────────────────────────────────────
  /projects/{id}/strategy:
    get:
      operationId: getMarketingStrategy
      tags: [strategy]
      summary: Get marketing strategy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marketing strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingStrategy"
    post:
      operationId: generateMarketingStrategy
      tags: [strategy]
      summary: Generate marketing strategy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated strategy
          content:
            application/json:
              schema:
