openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: GrowthForge AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: projects
  - name: analysis
  - name: competitors
  - name: strategy
  - name: content
  - name: social
  - name: email
  - name: ads
  - name: videos
  - name: campaigns
  - name: assets
  - name: analytics
  - name: agent
  - name: render
  - name: images
  - name: storage
  - name: meta
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Unhealthy — a required server dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Projects ──────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/dashboard:
    get:
      operationId: getProjectDashboard
      tags: [projects]
      summary: Get dashboard summary for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ── Analysis ───────────────────────────────────────────────────────────────
  /projects/{id}/analyze:
    post:
      operationId: analyzeWebsite
      tags: [analysis]
      summary: Trigger website analysis for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessAnalysis"

  /projects/{id}/analysis:
    get:
      operationId: getBusinessAnalysis
      tags: [analysis]
      summary: Get stored business analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Business analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessAnalysis"

  /projects/{id}/personas:
    get:
      operationId: listPersonas
      tags: [analysis]
      summary: List customer personas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of personas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerPersona"
    post:
      operationId: generatePersonas
      tags: [analysis]
      summary: Generate customer personas for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated personas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerPersona"

  # ── Strategy ───────────────────────────────────────────────────────────────
  /projects/{id}/strategy:
    get:
      operationId: getMarketingStrategy
      tags: [strategy]
      summary: Get marketing strategy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marketing strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingStrategy"
    post:
      operationId: generateMarketingStrategy
      tags: [strategy]
      summary: Generate marketing strategy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingStrategy"

  # ── Competitors ────────────────────────────────────────────────────────────
  /projects/{id}/competitors:
    get:
      operationId: listCompetitors
      tags: [competitors]
      summary: List competitors for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of competitors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competitor"
    post:
      operationId: discoverCompetitors
      tags: [competitors]
      summary: Discover competitors automatically
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discovered competitors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competitor"

  /projects/{id}/competitors/{competitorId}:
    get:
      operationId: getCompetitor
      tags: [competitors]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: competitorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Competitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competitor"

  /projects/{id}/competitor-report:
    get:
      operationId: getCompetitorReport
      tags: [competitors]
      summary: Get competitive intelligence report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Competitor report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorReport"
    post:
      operationId: generateCompetitorReport
      tags: [competitors]
      summary: Generate competitive intelligence report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorReport"

  # ── Content ────────────────────────────────────────────────────────────────
  /projects/{id}/content:
    get:
      operationId: listContent
      tags: [content]
      summary: List content assets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentAsset"
    post:
      operationId: generateContent
      tags: [content]
      summary: Generate content assets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentGenerationInput"
      responses:
        "200":
          description: Generated content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentAsset"

  /projects/{id}/content/{contentId}:
    get:
      operationId: getContent
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: contentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Content asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentAsset"
    delete:
      operationId: deleteContent
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: contentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Social ─────────────────────────────────────────────────────────────────
  /projects/{id}/social-posts:
    get:
      operationId: listSocialPosts
      tags: [social]
      summary: List social media posts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of social posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocialPost"
    post:
      operationId: generateSocialPosts
      tags: [social]
      summary: Generate social media posts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialPostInput"
      responses:
        "200":
          description: Generated social posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocialPost"

  /projects/{id}/meta/status:
    get:
      operationId: getMetaStatus
      tags: [social]
      summary: Check whether the stored Meta token is present and decryptable (no live API call)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Meta token status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaStatus"

  /projects/{id}/meta-connection:
    get:
      operationId: getMetaConnection
      tags: [social]
      summary: Get Meta (Facebook/Instagram) connection status for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Meta connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaConnection"
    delete:
      operationId: disconnectMeta
      tags: [social]
      summary: Disconnect Meta account from project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Disconnected successfully

  /auth/meta/pages:
    get:
      operationId: getMetaPages
      tags: [meta]
      summary: Get available Facebook Pages for a pending picker session
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Available pages to choose from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaPagesResult"
        "400":
          description: Missing token
        "404":
          description: Token not found or expired

  /auth/meta/select-page:
    post:
      operationId: selectMetaPage
      tags: [meta]
      summary: Select a Facebook Page from the picker and commit the connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaPageSelectInput"
      responses:
        "200":
          description: Page connected successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaConnection"
        "400":
          description: Missing token or pageId
        "404":
          description: Token not found, expired, or page not in list
        "500":
          description: Failed to connect page

  /projects/{id}/social-posts/{postId}/stats:
    get:
      operationId: getSocialPostStats
      tags: [social]
      summary: Fetch engagement stats (likes, comments, reach) for a published post from Meta
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Engagement stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialPostStats"
        "400":
          description: Post not published or no externalPostId
        "404":
          description: Post or Meta connection not found
        "502":
          description: Graph API error

  /projects/{id}/social-posts/{postId}/publish:
    post:
      operationId: publishSocialPost
      tags: [social]
      summary: Publish a social post to Facebook or Instagram via the Graph API
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishSocialInput"
      responses:
        "200":
          description: Published successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialPost"
        "400":
          description: Already published or invalid platform
        "404":
          description: Post or Meta connection not found
        "409":
          description: Business analysis not complete
        "502":
          description: Graph API error

  /projects/{id}/content-calendar:
    get:
      operationId: getContentCalendar
      tags: [social]
      summary: Get content calendar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Content calendar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEntry"

  # ── Email ──────────────────────────────────────────────────────────────────
  /projects/{id}/emails:
    get:
      operationId: listEmails
      tags: [email]
      summary: List email campaigns
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of email campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailCampaign"
    post:
      operationId: generateEmails
      tags: [email]
      summary: Generate email campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCampaignInput"
      responses:
        "200":
          description: Generated email campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailCampaign"

  /projects/{id}/emails/send-config:
    get:
      operationId: getEmailSendConfig
      tags: [email]
      summary: Check whether email sending is configured (RESEND_API_KEY present)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Email send configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSendConfig"

  /projects/{id}/emails/{emailId}/send:
    post:
      operationId: sendEmail
      tags: [email]
      summary: Send an email campaign to a list of recipients
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: emailId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSendInput"
      responses:
        "200":
          description: Campaign sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailCampaign"
        "400":
          description: Already sent or invalid recipients
        "404":
          description: Email campaign not found
        "409":
          description: Business analysis not complete
        "502":
          description: All sends failed (Resend error)

  # ── Ads ────────────────────────────────────────────────────────────────────
  /projects/{id}/ads:
    get:
      operationId: listAds
      tags: [ads]
      summary: List ad creatives
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of ads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdCreative"
    post:
      operationId: generateAds
      tags: [ads]
      summary: Generate ad creatives
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdInput"
      responses:
        "200":
          description: Generated ad creatives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdCreative"

  # ── Videos ─────────────────────────────────────────────────────────────────
  /projects/{id}/videos:
    get:
      operationId: listVideos
      tags: [videos]
      summary: List videos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
    post:
      operationId: generateVideos
      tags: [videos]
      summary: Generate videos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoInput"
      responses:
        "200":
          description: Generated videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"

  /projects/{id}/videos/{videoId}:
    get:
      operationId: getVideo
      tags: [videos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
    patch:
      operationId: updateVideo
      tags: [videos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoUpdate"
      responses:
        "200":
          description: Updated video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
    delete:
      operationId: deleteVideo
      tags: [videos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Video Renders ────────────────────────────────────────────────────────────
  /projects/{id}/videos/{videoId}/render:
    post:
      operationId: startVideoRender
      tags: [render]
      summary: Start a video render (paid plans only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoRenderInput"
      responses:
        "200":
          description: Video with updated render status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "409":
          description: Render already in progress
        "422":
          description: Avatar photo missing for avatar/combined mode
        "503":
          description: Render services not yet configured
    get:
      operationId: getVideoRenderStatus
      tags: [render]
      summary: Poll video render status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current render status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoRenderStatus"

  # ── AI Images ────────────────────────────────────────────────────────────────
  /projects/{id}/images/generate:
    post:
      operationId: generateImage
      tags: [images]
      summary: Generate AI marketing images grounded in business context
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageGenerateInput"
      responses:
        "200":
          description: Generated image URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedImages"
        "403":
          description: Trial limit exceeded

  # ── Object Storage ──────────────────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields
        "500":
          description: Failed to generate upload URL

  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object from private storage
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found

  # ── Campaigns ──────────────────────────────────────────────────────────────
  /projects/{id}/campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List ad campaigns
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create/generate an ad campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /projects/{id}/campaigns/{campaignId}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /projects/{id}/campaigns/{campaignId}/performance:
    get:
      operationId: getCampaignPerformance
      tags: [campaigns]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: campaignId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign performance metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignPerformance"

  # ── Assets ─────────────────────────────────────────────────────────────────
  /projects/{id}/assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List all assets in library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"

  # ── Analytics ──────────────────────────────────────────────────────────────
  /projects/{id}/analytics:
    get:
      operationId: getProjectAnalytics
      tags: [analytics]
      summary: Get project analytics overview
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAnalytics"

  /projects/{id}/reports:
    get:
      operationId: listReports
      tags: [analytics]
      summary: List generated reports
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: generateReport
      tags: [analytics]
      summary: Generate a report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "200":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  # ── AI Agent ───────────────────────────────────────────────────────────────
  /projects/{id}/agent/chat:
    post:
      operationId: agentChat
      tags: [agent]
      summary: Send a message to the AI marketing agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentMessageInput"
      responses:
        "200":
          description: Agent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMessage"

  /projects/{id}/usage:
    get:
      operationId: getProjectUsage
      tags: [projects]
      summary: Get quota usage for a project (trial or paid plan)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quota usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUsage"
        "401":
          description: Unauthorized
        "404":
          description: Project not found

  /projects/{id}/agent/history:
    get:
      operationId: getAgentHistory
      tags: [agent]
      summary: Get AI agent conversation history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentMessage"

  # ── Platform Avatar Library ───────────────────────────────────────────────
  /platform-avatars:
    get:
      operationId: listPlatformAvatars
      tags: [videos]
      summary: List active platform avatars for the avatar picker
      responses:
        "200":
          description: List of active platform avatars
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAvatarList"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
        reason:
          type: string
          description: Human-readable explanation when status is not "ok"

    # ── Project ──────────────────────────────────────────────────────────────
    Project:
      type: object
      required: [id, name, websiteUrl, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        websiteUrl:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
        industry:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        autonomousMode:
          type: boolean
        plan:
          type: string
        brandingCompanyName:
          type: ["string", "null"]
        brandingAccentColor:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    ProjectInput:
      type: object
      required: [name, websiteUrl]
      properties:
        name:
          type: string
        websiteUrl:
          type: string
        description:
          type: string

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        websiteUrl:
          type: string
        description:
          type: string
        autonomousMode:
          type: boolean
        brandingCompanyName:
          type: ["string", "null"]
        brandingAccentColor:
          type: ["string", "null"]

    DashboardSummary:
      type: object
      required: [projectId, totalContent, totalVideos, totalCampaigns, totalCompetitors, recentActivity]
      properties:
        projectId:
          type: integer
        totalContent:
          type: integer
        totalVideos:
          type: integer
        totalCampaigns:
          type: integer
        totalCompetitors:
          type: integer
        totalAds:
          type: integer
        totalEmails:
          type: integer
        totalSocialPosts:
          type: integer
        analysisStatus:
          type: ["string", "null"]
        hasStrategy:
          type: boolean
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        topMetrics:
          type: array
          items:
            $ref: "#/components/schemas/MetricItem"

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        createdAt:
          type: string

    MetricItem:
      type: object
      required: [label, value, change]
      properties:
        label:
          type: string
        value:
          type: string
        change:
          type: number
        trend:
          type: string

    # ── Analysis ─────────────────────────────────────────────────────────────
    AnalysisInput:
      type: object
      required: [websiteUrl]
      properties:
        websiteUrl:
          type: string
        prompt:
          type: string
        businessDescription:
          type: string
          description: Optional manual business description used as fallback when the website cannot be scraped.

    BusinessAnalysis:
      type: object
      required: [id, projectId, status, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        status:
          type: string
        businessSummary:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        products:
          type: ["string", "null"]
        services:
          type: ["string", "null"]
        uniqueValueProposition:
          type: ["string", "null"]
        targetCustomers:
          type: ["string", "null"]
        idealCustomerProfile:
          type: ["string", "null"]
        customerPainPoints:
          type: ["string", "null"]
        brandVoice:
          type: ["string", "null"]
        brandPositioning:
          type: ["string", "null"]
        customerBenefits:
          type: ["string", "null"]
        purchaseTriggers:
          type: ["string", "null"]
        marketOpportunities:
          type: ["string", "null"]
        growthOpportunities:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    CustomerPersona:
      type: object
      required: [id, projectId, name, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        age:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        occupation:
          type: ["string", "null"]
        income:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        interests:
          type: ["string", "null"]
        motivations:
          type: ["string", "null"]
        objections:
          type: ["string", "null"]
        buyingTriggers:
          type: ["string", "null"]
        buyingJourney:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    # ── Strategy ─────────────────────────────────────────────────────────────
    MarketingStrategy:
      type: object
      required: [id, projectId, status, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        status:
          type: string
        positioningStatement:
          type: ["string", "null"]
        messagingFramework:
          type: ["string", "null"]
        brandVoiceGuide:
          type: ["string", "null"]
        seoStrategy:
          type: ["string", "null"]
        campaignStrategy:
          type: ["string", "null"]
        leadGenerationStrategy:
          type: ["string", "null"]
        funnelRecommendations:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    # ── Competitors ──────────────────────────────────────────────────────────
    Competitor:
      type: object
      required: [id, projectId, name, websiteUrl, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        websiteUrl:
          type: string
        industry:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        strengths:
          type: ["string", "null"]
        weaknesses:
          type: ["string", "null"]
        marketGaps:
          type: ["string", "null"]
        pricingInsights:
          type: ["string", "null"]
        messagingInsights:
          type: ["string", "null"]
        hookStrength:
          type: ["integer", "null"]
        conversionPotential:
          type: ["integer", "null"]
        differentiationScore:
          type: ["integer", "null"]
        createdAt:
          type: string

    CompetitorReport:
      type: object
      required: [projectId, competitors, generatedAt]
      properties:
