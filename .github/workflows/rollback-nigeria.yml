name: Rollback Nigeria DEV

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA to roll back to (empty = previous commit)
        required: false
        default: ""

jobs:
  rollback:
    name: Rollback Nigeria DEV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gate - refuse to roll back unless the pipeline is configured
        if: vars.NIGERIA_CI_ENABLED != 'true' || secrets.NIGERIA_SSH_KEY == '' || secrets.NIGERIA_SSH_KNOWN_HOSTS == ''
        run: |
          echo "::error::Nigeria CI is not configured."
          exit 1

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.NIGERIA_SSH_KEY }}

      - name: Pin the Lightsail host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.NIGERIA_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Rebuild previous commit and restart
        env:
          HOST: ${{ secrets.NIGERIA_SSH_HOST }}
          PORT: ${{ secrets.NIGERIA_SSH_PORT }}
          USER: ${{ secrets.NIGERIA_SSH_USER }}
        run: |
          TARGET='${{ github.event.inputs.target_sha }}'
          if [ -z "$TARGET" ]; then TARGET='HEAD~1'; fi
          ssh -o StrictHostKeyChecking=yes -p "${PORT}" "${USER}@${HOST}" \
            "cd /home/ubuntu/nigeria/app && git checkout feature/nigeria-paystack && git reset --hard '$TARGET' && bash scripts/deploy/build.sh && sudo systemctl restart growthforge-nigeria-api.service && curl -fsS -o /dev/null http://127.0.0.1:4101/api/healthz && echo ROLLBACK_OK"
