name: Deploy Nigeria DEV

on:
  push:
    branches:
      - feature/nigeria-paystack
  workflow_dispatch:

# Single-flight: never run two Nigeria deploys at once, never cancel one mid-deploy.
concurrency:
  group: nigeria-dev-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: API tests
        run: pnpm --filter @workspace/api-server run test

  deploy:
    name: Deploy to Lightsail (Nigeria DEV only)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gate - refuse to deploy unless the pipeline is fully configured
        if: vars.NIGERIA_CI_ENABLED != 'true' || secrets.NIGERIA_SSH_KEY == '' || secrets.NIGERIA_SSH_KNOWN_HOSTS == '' || secrets.NIGERIA_SSH_HOST == '' || secrets.NIGERIA_SSH_USER == ''
        run: |
          echo "::error::Nigeria CI is not configured. Set NIGERIA_CI_ENABLED=true (repo variable) and the NIGERIA_SSH_* secrets, then re-run."
          exit 1

      - name: Load runner deploy key (private key from GitHub secret; never committed)
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.NIGERIA_SSH_KEY }}

      - name: Pin the Lightsail host key (trusted known_hosts only)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.NIGERIA_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run Nigeria deploy script on the box
        env:
          HOST: ${{ secrets.NIGERIA_SSH_HOST }}
          PORT: ${{ secrets.NIGERIA_SSH_PORT }}
          USER: ${{ secrets.NIGERIA_SSH_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes -p "${PORT}" "${USER}@${HOST}" \
            'bash /home/ubuntu/nigeria/app/scripts/deploy/nigeria-deploy.sh'
