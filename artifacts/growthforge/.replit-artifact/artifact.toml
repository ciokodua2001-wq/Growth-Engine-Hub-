kind = "web"
previewPath = "/"
title = "GrowthForge AI"
version = "1.0.0"
id = "artifacts/growthforge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23190

[services.development]
run = "pnpm --filter @workspace/growthforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/growthforge", "run", "build" ]

[services.production.run]
args = ["node", "artifacts/growthforge/server.mjs"]

[services.production.run.env]
PORT = "23190"
NODE_ENV = "production"

[services.production.health.startup]
path = "/healthz"

[services.env]
PORT = "23190"
BASE_PATH = "/"
