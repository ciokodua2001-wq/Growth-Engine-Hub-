kind = "web"
previewPath = "/z-tutor/"
title = "Z — Quantivarian AI Tutor"
version = "1.0.0"
id = "artifacts/z-tutor"
router = "path"

[[services]]
name = "web"
paths = [ "/z-tutor/" ]
localPort = 23049

[services.development]
run = "pnpm --filter @workspace/z-tutor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/z-tutor", "run", "build" ]
serve = "static"
publicDir = "artifacts/z-tutor/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23049"
BASE_PATH = "/z-tutor/"
